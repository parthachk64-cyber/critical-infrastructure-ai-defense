name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # read-only: CI never commits or pushes

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: infra-defense data-check
      - run: python -m pytest --cov=infra_defense --cov-report=term-missing --cov-fail-under=80
